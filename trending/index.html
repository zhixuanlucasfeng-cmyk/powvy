<style>
/* Layout: manga page in the Powvy site style — ink nav bar, speed-line hero, one tilted panel per repo */
:root {
  --ink: #0d0d0d; --red: #d7261e; --orange: #f07a22; --paper: #efeae0; --white: #fff; --muted: #4a4a4a;
  --display: "Dela Gothic One", "ZCOOL QingKe HuangYou", sans-serif;
  --cn: "ZCOOL QingKe HuangYou", "Dela Gothic One", sans-serif;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --tone: radial-gradient(rgba(0,0,0,.13) 1px, transparent 1.5px) 0 0/6px 6px;
  --tone-w: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1.5px) 0 0/6px 6px;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font); color: var(--ink); background: var(--tone), var(--paper); line-height: 1.65; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
::selection { background: var(--red); color: #fff; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Shared Powvy navigation: Trending is a section of the personal site. */
.nav { position: sticky; top: 0; z-index: 50; background: var(--ink); color: #fff; border-bottom: 4px solid var(--red); }
.nav .wrap { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { flex: none; font-family: var(--display); font-size: 24px; letter-spacing: .02em; text-decoration: none; }
.logo span { color: var(--red); }
.nav-r { display: flex; align-items: center; gap: 10px; min-width: 0; }
.nav ul { display: flex; min-width: 0; gap: 2px; list-style: none; padding: 0; overflow-x: auto; scrollbar-width: none; }
.nav ul a { display: block; padding: 4px 14px; font-family: var(--cn); font-size: 19px; color: #bbb; white-space: nowrap; text-decoration: none; }
.nav ul a:hover { color: #fff; }
.nav ul a[aria-current] { background: var(--red); color: #fff; transform: skew(-12deg); }
.lang { flex: none; border: 2px solid #fff; color: #fff; background: none; font: 900 14px var(--font); padding: 2px 10px; cursor: pointer; }
.lang:hover { background: var(--red); }
.date { display: inline-block; margin-bottom: 20px; font: 700 13px var(--font); border: 2px solid var(--ink); background: var(--paper); padding: 3px 10px; }
@media (max-width: 640px) {
  .nav .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding-top: 8px; padding-bottom: 6px; }
  .nav-r { display: contents; }
  .nav ul { grid-column: 1 / -1; grid-row: 2; flex-wrap: wrap; overflow: visible; }
  .nav ul a { padding: 4px 9px; font-size: 17px; }
  .lang { grid-column: 2; grid-row: 1; }
}

/* hero with speed lines */
.hero { position: relative; overflow: hidden; border-bottom: 6px solid var(--ink); padding-block: 44px 40px; }
.hero::before { content: ""; position: absolute; inset: -20%; pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 75% 50%, var(--ink) 0deg .5deg, transparent .5deg 4.5deg);
  -webkit-mask: radial-gradient(circle at 75% 50%, transparent 20%, #000 64%); mask: radial-gradient(circle at 75% 50%, transparent 20%, #000 64%); opacity: .14; }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 32px; align-items: center; }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 7vw, 92px); line-height: .98; transform: rotate(-2deg); text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--red); -webkit-text-stroke: 2px var(--ink); text-shadow: 5px 5px 0 var(--ink); }
.bubble { margin-top: 26px; max-width: 30em; background: #fff; border: 3px solid var(--ink); padding: 12px 16px; position: relative; font-size: 15.5px; }
.bubble::after { content: ""; position: absolute; left: 36px; top: -14px; width: 22px; height: 14px; background: #fff; border: 3px solid var(--ink); border-bottom: 0; clip-path: polygon(0 100%, 30% 0, 100% 100%); }
.stats { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.stat { background: #fff; border: 3px solid var(--ink); padding: 6px 16px 4px; box-shadow: 5px 5px 0 var(--ink); rotate: -1deg; }
.stat:nth-child(2) { rotate: .8deg; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat:first-child b { color: var(--red); }
.stat span { font-size: 12px; font-weight: 800; color: var(--muted); }
.panel { position: relative; background: #fff; border: 4px solid var(--ink); box-shadow: 10px 10px 0 var(--red); padding: 16px 14px 8px; }
.panel h2 { font-family: var(--cn); font-weight: 400; font-size: 24px; line-height: 1; margin: 0 0 6px 4px; }
.panel svg { display: block; width: 100%; height: auto; }
.sfx { position: absolute; font-family: var(--display); color: var(--red); -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--ink); pointer-events: none; line-height: 1; }
.sfx.a { top: -26px; right: -8px; font-size: clamp(30px, 4vw, 46px); transform: rotate(10deg); }

/* toolbar */
.toolbar { margin-block: 34px 26px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: var(--ink); color: #fff; padding: 12px 16px; border-left: 8px solid var(--red); }
.toolbar label { display: inline-flex; align-items: center; gap: 8px; font-family: var(--cn); font-size: 19px; cursor: pointer; white-space: nowrap; }
.toolbar .search { flex: 1 1 220px; min-width: 0; }
input[type=search], select { font: 700 15px var(--font); color: var(--ink); background: #fff; border: 3px solid #fff; padding: 5px 10px; border-radius: 0; width: 100%; }
select { width: auto; cursor: pointer; }
.box { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; flex: none; border: 3px solid #fff; background: transparent; cursor: pointer; display: grid; place-items: center; transform: skew(-8deg); }
.box:checked { background: var(--red); }
.box:checked::after { content: "✕"; color: #fff; font: 900 14px/1 var(--font); }
/* AI news / GitHub switch: [data-gh] and [data-news] only show in their own mode */
body.news [data-gh], body:not(.news) [data-news] { display: none !important; }
.modes { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
.modes button { font: 400 22px var(--display); color: var(--ink); background: #fff; border: 3px solid var(--ink); padding: 4px 18px 2px; cursor: pointer; transform: skew(-8deg); transition: transform .15s, box-shadow .15s; }
.modes button[aria-pressed=true] { background: var(--ink); color: #fff; box-shadow: 5px 5px 0 var(--red); }
.modes button:hover { transform: skew(-8deg) translateY(-2px); }
.brief { list-style: none; padding: 4px 4px 8px; counter-reset: b; display: grid; gap: 10px; }
.brief li { counter-increment: b; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; border-bottom: 2px dashed rgba(0,0,0,.18); padding-bottom: 8px; }
.brief li::before { content: counter(b); font: 400 24px/1 var(--display); color: var(--red); -webkit-text-stroke: 1px var(--ink); }
.brief a { font-weight: 800; font-size: 15px; line-height: 1.4; text-decoration: none; }
.brief a:hover { color: var(--red); }
.brief b { font: 400 15px var(--display); font-variant-numeric: tabular-nums; }
.why { margin-top: 10px; border-left: 4px solid var(--red); padding-left: 10px; font-size: 14.5px; }
.why b { font-family: var(--cn); font-weight: 400; font-size: 17px; margin-right: 6px; }
.srcs { margin-top: 10px; font-size: 13px; color: var(--muted); }
.srcs a { font-weight: 800; color: var(--ink); }
.srcs a:hover { color: var(--red); }
.heat { font: 400 20px var(--display); }
.heat small { font: 800 12px var(--font); color: var(--muted); display: block; }
.tabs { display: flex; flex-wrap: wrap; gap: 0; }
.tabs button { font: 400 19px var(--cn); color: #fff; background: none; border: 3px solid #fff; padding: 3px 14px; cursor: pointer; }
.tabs button + button { border-left: 0; }
.tabs button[aria-pressed=true] { background: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: -12px 0 26px; }
.chip { font: 800 13.5px var(--font); border: 2px solid var(--ink); background: #fff; color: var(--ink); padding: 2px 10px; cursor: pointer; }
.chip b { font-family: var(--display); font-weight: 400; color: var(--red); margin-left: 4px; }
.chip[aria-pressed=true] { background: var(--ink); color: #fff; transform: skew(-8deg); }
.card .box { border-color: var(--ink); background: #fff; }
.card .box:checked { background: var(--red); }

/* cards = manga panels */
.list { display: grid; gap: 30px; }
.card { --r: -.5deg; display: grid; grid-template-columns: 96px minmax(0, 1fr) 240px; gap: 10px 24px; background: #fff; border: 3px solid var(--ink); padding: 20px 22px; rotate: var(--r); transition: rotate .15s, transform .15s, box-shadow .15s; }
.card:nth-child(even) { --r: .45deg; }
.card:nth-child(3n) { --r: -.2deg; }
.card:hover { rotate: 0deg; transform: translateY(-5px); box-shadow: 8px 8px 0 var(--red), 8px 8px 0 3px var(--ink); }
.card.picked { box-shadow: 8px 8px 0 var(--red), 8px 8px 0 3px var(--ink); }
.rankbox { position: relative; width: 96px; height: 96px; border: 3px solid var(--ink); background: var(--tone), var(--paper); display: grid; place-items: center; overflow: hidden; }
.rankbox::before { content: ""; position: absolute; inset: -30%; background: repeating-conic-gradient(var(--ink) 0deg .6deg, transparent .6deg 7deg); opacity: .22; -webkit-mask: radial-gradient(circle, transparent 28%, #000 70%); mask: radial-gradient(circle, transparent 28%, #000 70%); }
.rankbox b { position: relative; font-family: var(--display); font-weight: 400; font-size: 42px; line-height: 1; color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 3px 3px 0 var(--ink); }
.rankbox.top b { color: var(--red); }
.rankbox small { position: absolute; top: 4px; left: 6px; font-family: var(--display); font-size: 10px; letter-spacing: .1em; }
.main { min-width: 0; }
.title a { font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.2; text-decoration: none; overflow-wrap: anywhere; }
.title a .owner { color: var(--muted); font-size: .72em; }
.title a:hover { color: var(--red); }
.desc { margin: 4px 0 10px; color: var(--muted); font-size: 14.5px; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { max-width: 100%; overflow-wrap: anywhere; display: inline-block; border: 2px solid var(--ink); padding: 0 9px; font-size: 12.5px; font-weight: 800; background: #fff; white-space: normal; }
.tag.red { background: var(--red); color: #fff; transform: skew(-10deg); font-variant-numeric: tabular-nums; }
.tag.ink { background: var(--ink); color: #fff; }
.tag.orange { background: var(--orange); }
dl.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; }
dl.facts dt { font-family: var(--cn); font-size: 18px; line-height: 1.4; white-space: nowrap; }
dl.facts dt::before { content: "■ "; color: var(--red); font-size: .7em; vertical-align: 2px; }
dl.facts dd { font-size: 14.5px; overflow-wrap: anywhere; }
dl.facts ul { padding-left: 1.2em; }
dl.facts li::marker { color: var(--red); font-weight: 900; }
dl.facts dd.warn { border-left: 4px solid var(--red); padding-left: 10px; }
dl.facts dd.warn ul { padding-left: 1em; }
code { font: 700 13px ui-monospace, "SF Mono", Menlo, monospace; background: var(--paper); border: 1px solid #ccc; padding: 0 5px; }

.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.score { display: flex; align-items: center; gap: 12px; }
.score .big { background: var(--red); border: 3px solid var(--ink); padding: 4px 14px 2px; transform: skew(-10deg); box-shadow: 4px 4px 0 var(--ink); }
.score .big b { display: block; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; color: #fff; -webkit-text-stroke: 1.5px var(--ink); font-variant-numeric: tabular-nums; }
.score small { display: block; font-size: 12px; font-weight: 800; color: var(--muted); }
.score .pushed { font-family: var(--display); font-size: 13px; font-variant-numeric: tabular-nums; }
.bars svg { width: 100%; height: auto; display: block; }
.pick { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-family: var(--cn); font-size: 19px; cursor: pointer; }

/* excluded + footer */
details.excl { margin-top: 44px; background: var(--tone-w), var(--ink); color: #fff; border: 3px solid var(--ink); padding: 16px 20px; }
details.excl summary { cursor: pointer; font-family: var(--cn); font-size: 24px; list-style: none; }
details.excl summary::-webkit-details-marker { display: none; }
details.excl summary::before { content: "▶ "; color: var(--red); font-size: .7em; }
details.excl[open] summary::before { content: "▼ "; }
.excl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 8px 20px; margin-top: 14px; }
.excl-grid div { font-size: 13px; overflow-wrap: anywhere; }
.excl-grid a { font-weight: 800; }
.excl-grid a:hover { color: var(--red); }
.excl-grid span { color: #bbb; }
footer { margin-top: 56px; background: var(--tone), var(--red); border-top: 6px solid var(--ink); padding-block: 36px 40px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
footer .big { font-family: var(--display); font-size: clamp(30px, 5vw, 54px); line-height: 1; color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 5px 5px 0 var(--ink); transform: rotate(-1.5deg); }
footer small { display: block; font-weight: 800; margin-top: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 3px solid var(--ink); padding: 5px 16px; font-family: var(--cn); font-size: 19px; background: var(--ink); color: #fff; cursor: pointer; transition: background .15s, transform .15s; }
.btn:hover { background: #fff; color: var(--ink); transform: skew(-8deg); }
.empty { text-align: center; padding: 36px; font-family: var(--cn); font-size: 22px; background: #fff; border: 3px dashed var(--ink); }

@media (max-width: 880px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); }
  .card { grid-template-columns: 72px minmax(0, 1fr); }
  .rankbox { width: 72px; height: 72px; }
  .rankbox b { font-size: 32px; }
  .side { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .bars { flex: 1 1 230px; }
}
@media (max-width: 480px) {
  .card { padding: 16px 14px; }
  dl.facts { grid-template-columns: minmax(0, 1fr); }
  .nav .date { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// halftone pattern + four ink bars (scores 1-10)
function bars(s) {
  const W = 240, rowH = 26, lab = 54, max = W - lab - 26;
  const rows = DIMS.map((k, i) => {
    const label = t("dims")[i];
    const y = i * rowH + 3, w = Math.max(4, max * s[k] / 10), hot = s[k] >= 9;
    return `<text x="0" y="${y + 15}" font-size="15" fill="#0d0d0d" font-family="ZCOOL QingKe HuangYou, PingFang SC, sans-serif">${label}</text>
      <rect x="${lab}" y="${y + 2}" width="${max}" height="16" fill="url(#dots)" stroke="#0d0d0d" stroke-width="2"/>
      <rect x="${lab}" y="${y + 2}" width="${w}" height="16" fill="${hot ? "#d7261e" : "#0d0d0d"}" stroke="#0d0d0d" stroke-width="2"/>
      <text x="${lab + max + 6}" y="${y + 16}" font-size="14" fill="#0d0d0d" font-family="Dela Gothic One, sans-serif">${s[k]}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${rowH * 4 + 4}" role="img" aria-label="四维评分">${rows}</svg>`;
}

function overview(ps) {
  const W = 560, H = 250, l = 30, b = 196, top = 24, n = ps.length;
  const step = (W - l - 10) / Math.max(n, 1), bw = Math.min(30, step * .62), y = v => b - (b - top) * v / 10;
  let g = `<defs><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><circle cx="3" cy="3" r="1.2" fill="#0d0d0d" fill-opacity=".35"/></pattern></defs>`;
  for (const t of [0, 5, 10]) g += `<line x1="${l}" x2="${W - 6}" y1="${y(t)}" y2="${y(t)}" stroke="#0d0d0d" stroke-opacity="${t ? .2 : 1}" stroke-width="${t ? 1.5 : 3}" ${t ? 'stroke-dasharray="4 5"' : ""}/>
    <text x="${l - 8}" y="${y(t) + 5}" text-anchor="end" font-size="13" fill="#4a4a4a" font-family="Dela Gothic One, sans-serif">${t}</text>`;
  ps.forEach((p, i) => {
    const x = l + step * i + (step - bw) / 2, h = b - y(p.overall), short = p.name.split("/")[1];
    g += `<rect x="${x + 4}" y="${y(p.overall) + 4}" width="${bw}" height="${h - 4}" fill="#0d0d0d"/>

  });
  $("#overview").innerHTML = g;
}

  const sorted = [...ns].sort(nsortKey === "heat" ? (a, b) => b.heat - a.heat || b.score - a.score : (a, b) => b.score - a.score);
  const es = sorted.filter(e => !q || [e.title.zh, e.title.en, e.summary.zh, e.summary.en, ...e.sources.map(s => s.source)].join(" ").toLowerCase().includes(q));
  $("#list").innerHTML = !ns.length ? `<div class="empty">${t("noNews")}</div>`
    : es.length ? es.map(e => ncard(e, sorted.indexOf(e) + 1)).join("") : `<div class="empty">${t("empty")}</div>`;
}

function render() {
  if (mode === "news") return renderNews();
  const q = $("#q").value.trim().toLowerCase(), key = sortKey, lng = $("#lng").value;
  const sorted = [...DATA.projects].sort((a, b) => b[key] - a[key] || b.overall - a.overall);
  const rankOf = new Map(sorted.map((p, i) => [p.name, i + 1]));
  const ps = sorted
    .filter(p => !cat || (p.cats || []).includes(cat))
    .filter(p => !lng || p.language === lng)
    .filter(p => !$("#f-picked").checked || picked.has(p.name))
    .filter(p => !q || [p.name, p.description, f(p, "type"), f(p, "stack"), p.language].join(" ").toLowerCase().includes(q));
  $("#list").innerHTML = ps.length ? ps.map(p => card(p, rankOf.get(p.name))).join("")
    : `<div class="empty">${t("empty")}</div>`;
}

function applyLang() {
  const d = DATA, n = d.projects.length;
  document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $("#lang").textContent = t("toggle");
  $("#copy").textContent = t("copy");
  const ns = d.news || [], news = mode === "news";
  document.body.classList.toggle("news", news);
  $("#modes").querySelectorAll("button").forEach(b => { b.textContent = t(b.dataset.mode === "news" ? "mNews" : "mGh"); b.setAttribute("aria-pressed", b.dataset.mode === mode); });
  $("#h1").innerHTML = t(news ? "h1n" : "h1");
  $("#chart").textContent = t(news ? "chartN" : "chart");
  $("#q").placeholder = t(news ? "nsearch" : "search");
  $("#brief").innerHTML = [...ns].sort((a, b) => b.score - a.score).slice(0, 5)
    .map(e => `<li><a href="${esc(e.sources[0].url)}" target="_blank" rel="noopener">${esc(e.title[lang] || e.title.zh)}</a><b>${e.score}</b></li>`).join("") || `<li>${t("noNews")}</li>`;
  $("#credit").innerHTML = `${t("credit")}<a href="https://github.com/KKKKhazix/AIHOT" target="_blank" rel="noopener">AIHOT</a> (MIT).`;
  $("#lede").textContent = news ? T[lang].ledeN(d.news_scanned || 0, ns.length) : T[lang].lede(d.total_fetched, n, d.min_today || 100);
  const count = k => d.projects.filter(p => (p.cats || []).includes(k)).length;
  $("#cats").innerHTML = [["", t("allCats"), n], ...Object.keys(CATS).map(k => [k, CATS[k][lang === "en" ? 1 : 0], count(k)]).filter(c => c[2])]
    .map(([k, label, c]) => `<button type="button" class="chip" data-cat="${k}" aria-pressed="${k === cat}">${esc(label)}<b>${c}</b></button>`).join("");
  const langs = {}; d.projects.forEach(p => p.language && (langs[p.language] = (langs[p.language] || 0) + 1));
  const cur = $("#lng").value;
  $("#lng").innerHTML = `<option value="">${t("allLangs")}</option>` + Object.entries(langs).sort((a, b) => b[1] - a[1])
    .map(([l, c]) => `<option value="${esc(l)}" ${l === cur ? "selected" : ""}>${esc(l)} (${c})</option>`).join("");
  const top = d.projects.reduce((a, p) => p.stars_today > a.stars_today ? p : a, d.projects[0] || { stars_today: 0 });
  $("#stats").innerHTML = (news ? [ns.length, d.news_scanned || 0, Math.max(0, ...ns.map(e => e.heat))] : [n, d.excluded.length, "+" + fmt(top.stars_today)])
    .map((v, i) => `<div class="stat"><b>${v}</b><span>${t(news ? "statsN" : "stats")[i]}</span></div>`).join("");
  $("#rule").textContent = news ? t("ruleN") : T[lang].rule(d.weights);
  $("#excl-sum").textContent = T[lang].excl(d.excluded.length);
  $("#excl").innerHTML = d.excluded.map(e => `<div><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.name)}</a> <span>${esc(e.reason[lang] || e.reason.zh)}</span></div>`).join("");
  render();
}

function show() {
  $("#date").textContent = DATA.date;
  if (!(DATA.projects.some(p => (p.cats || []).includes(cat)))) cat = "";
  overview([...DATA.projects].sort((a, b) => b.overall - a.overall).slice(0, 15));
  applyLang();
}

function init() {
  $("#day").innerHTML = DAYS.map(x => `<option>${x}</option>`).join("");
  show();
  $("#day").addEventListener("change", async e => {
    try { DATA = await (await fetch(`data/${e.target.value}.json`)).json(); show(); }
    catch { e.target.value = DATA.date; $("#list").innerHTML = `<div class="empty">${t("loadErr")}</div>`; }
  });
  $("#sort").addEventListener("click", e => {
    const k = e.target.dataset.k; if (!k) return;
    sortKey = k; $("#sort").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === e.target)); render();
  });
  $("#modes").addEventListener("click", e => {
    const m = e.target.dataset.mode; if (!m || m === mode) return;
    mode = m; try { localStorage.setItem("powvy-hot-mode", m); } catch {}
    history.replaceState(null, "", m === "news" ? "#news" : "#github"); $("#q").value = ""; applyLang();
  });
  $("#nsort").addEventListener("click", e => {
    const k = e.target.dataset.k; if (!k) return;
    nsortKey = k; $("#nsort").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === e.target)); render();
  });
  $("#cats").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    cat = b.dataset.cat; $("#cats").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
  });
  $("#lang").addEventListener("click", () => {
    lang = lang === "en" ? "zh" : "en";
    try { localStorage.setItem("powvy-lang", lang); } catch {}
    applyLang();
  });
  ["#q", "#lng", "#f-picked"].forEach(s => $(s).addEventListener("input", render));
  $("#list").addEventListener("change", e => {
    const name = e.target.dataset.pick; if (!name) return;
    e.target.checked ? picked.add(name) : picked.delete(name); savePicked();
    e.target.closest(".card").classList.toggle("picked", e.target.checked);
    if ($("#f-picked").checked) render();
  });
  $("#copy").addEventListener("click", async () => {
    const txt = JSON.stringify(DATA, null, 2), btn = $("#copy");
    try { await navigator.clipboard.writeText(txt); btn.textContent = t("copied"); }
    catch { const ta = document.createElement("textarea"); ta.value = txt; document.body.append(ta); ta.select(); btn.textContent = t("selected"); }
    setTimeout(() => btn.textContent = t("copy"), 2400);
  });
}
init();
</script>

</html>
